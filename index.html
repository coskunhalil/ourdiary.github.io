  }
  .avatar-frame:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 12px 28px rgba(196, 130, 58, 0.25); z-index: 4; }
  .avatar-frame.left { z-index: 1; }
  .avatar-frame.right { margin-left: -22px; z-index: 2; }
  .avatar-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .heart-badge {
    position: absolute; z-index: 5; background: var(--card); border: 2px solid var(--border);
    border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;

  }
  @keyframes heartPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

  .mood-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .mood-badge {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.82rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    transition: all 0.2s ease;
  }
  .mood-badge:hover { transform: translateY(-2px); border-color: var(--accent); }
